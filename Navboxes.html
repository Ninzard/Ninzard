<!--
  NAVBOXES. A page shows one of these boxes by naming it:
    <nav class="navbox" data-box="Four RadicaLs"></nav>
  wiki.js copies the box with that data-title from here and marks the page's own entry.
  Change a box here and every page that shows it updates. Write names plainly: wiki.js links them.
  To start the numbering later, give the <ol> style="counter-reset:p 2" (the first entry is then 3).
-->
<body data-tab="Navboxes" data-edited="17 October 2026">

<h1>Navboxes</h1>

<p>The navigation boxes shared between pages. Each appears at the foot of every page that names it.</p>

<nav class="navbox" data-title="Four RadicaLs">
  <ol>
    <li>Lesty</li>
    <li>Liver</li>
    <li>Lless</li>
    <li>Lyman</li>
  </ol>
</nav>

<nav class="navbox" data-title="District Generals of Main">
  <ol>
    <li>Elusion</li>
    <li>Xorbit</li>
    <li>Whyskitter</li>
    <li>Syn</li>

    <li>Grace</li>
    <li>Danbi</li>
    <li>Geo</li>
    <li>Sundaze</li>
    <li>Woofer</li>
  </ol>
</nav>

<script src="wiki.js"></script>
</body>
</html>
