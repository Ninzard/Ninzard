<style>
:root{
  /* the same colours as the COLOURS block in wiki.css */
  --night:#0b0612;--deck:#140a20;--deck2:#1b0e2b;--line:#3a2452;
  --ink:#ece4f5;--mute:#a492ba;--accent:#ff8fb4;--link:#c3a2ff;--bad:#ff9b9b;
  --disp:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --text:Arial,'Helvetica Neue',Helvetica,'Liberation Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:dark;background:var(--night)}
.staticrypt-html{height:100%}
.staticrypt-body{
  margin:0;min-height:100%;color:var(--ink);font:400 16px/1.6 var(--text);
  background:
    radial-gradient(1100px 560px at 90% -10%,rgba(140,62,170,.17),transparent 62%),
    radial-gradient(900px 620px at -6% 40%,rgba(82,60,123,.13),transparent 66%),
    radial-gradient(1000px 520px at 60% 112%,rgba(139,48,68,.12),transparent 64%),
    linear-gradient(180deg,#0b0612,#0d0715 55%,#120715),
    var(--night);
  background-attachment:fixed;
}
.staticrypt-body::after{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(225,200,255,.02) 0 1px,transparent 1px 3px);
}
.hidden{display:none!important}

.staticrypt-spinner-container{min-height:100vh;display:flex;align-items:center;justify-content:center}
.staticrypt-spinner{width:2rem;height:2rem;border:.22em solid var(--line);border-right-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite}

.staticrypt-content{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate{position:relative;width:100%;max-width:380px;padding:26px 28px 28px;background:linear-gradient(180deg,var(--deck2),var(--deck));border:1px solid var(--line)}
.gate::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:2px;background:linear-gradient(90deg,var(--accent),rgba(195,162,255,.55) 55%,rgba(195,162,255,0))}

.brand{display:flex;align-items:center;gap:11px;padding-bottom:18px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.logo{display:block;flex:none;line-height:0}
/* the logo's idle glow: the same as --logo-glow and --logo-pulse in wiki.css */
.logo svg{display:block;width:44px;height:44px;
  filter:drop-shadow(0 0 4px rgba(160,85,200,.45)) drop-shadow(0 0 12px rgba(150,50,90,.28));animation:logoGlow 4.5s ease-in-out infinite}
@keyframes logoGlow{50%{filter:drop-shadow(0 0 6px rgba(185,110,230,.7)) drop-shadow(0 0 20px rgba(175,60,115,.45))}}
.brand-name{display:block;font:600 15px/1.15 var(--disp);letter-spacing:.06em}
.brand-sub{display:block;font:italic 400 13px/1.3 var(--text);color:var(--mute)}

.staticrypt-title{margin:0 0 4px;font:700 30px/1.1 var(--disp)}
.staticrypt-note{margin:0 0 18px;font-size:15px;color:var(--mute)}

.staticrypt-password-container{display:flex;align-items:center;background:var(--night);border:1px solid var(--line)}
.staticrypt-password-container:focus-within{border-color:var(--accent)}
#staticrypt-password{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--ink);font:500 16px/1.2 var(--disp);padding:12px 14px}
#staticrypt-password::placeholder{color:var(--mute)}
.staticrypt-toggle-password-visibility{width:44px;height:44px;padding:12px;cursor:pointer;opacity:.6;filter:invert(1)}
.staticrypt-toggle-password-visibility:hover{opacity:.9}

.staticrypt-remember{display:flex;align-items:center;gap:10px;margin:14px 0 0;font:500 14px/1.3 var(--disp);color:var(--mute);cursor:pointer;user-select:none}
.staticrypt-remember input{width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer}
.staticrypt-remember:hover{color:var(--ink)}
.gate-error{margin:10px 0 0;font:500 14px/1.4 var(--disp);color:var(--bad)}

.staticrypt-decrypt-button{display:block;width:100%;margin-top:16px;padding:12px;border:0;background:linear-gradient(90deg,var(--accent),#d9a0ff);color:#24081a;font:600 15px/1 var(--disp);cursor:pointer}
.staticrypt-decrypt-button:hover{filter:brightness(1.08)}
.staticrypt-remember input:focus-visible,.staticrypt-decrypt-button:focus-visible,.staticrypt-toggle-password-visibility:focus-visible{outline:2px solid var(--link);outline-offset:2px}

@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
